<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Tasklane: a fast kanban board for small teams." />
    <title>Tasklane</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233b5bfd'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h5' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved appearance before first paint; default is the light "paper" theme with cobalt.
      var root = document.documentElement;
      try {
        root.dataset.theme = localStorage.getItem('tl-theme') || 'light';
        root.dataset.palette = localStorage.getItem('tl-palette') || 'cobalt';
      } catch (e) {
        root.dataset.theme = 'light';
        root.dataset.palette = 'cobalt';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
