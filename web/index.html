<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Birge: a real-time kanban board for teams. Birge means “together” in Kazakh." />
    <title>Birge</title>
    <!-- Favicon: the dotless i of the wordmark with its live dot. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%231b1c22'/%3E%3Crect x='13' y='13' width='6' height='13' rx='3' fill='%23f4f2ec'/%3E%3Ccircle cx='16' cy='7.5' r='3.6' fill='%2322c55e'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#f4f2ec" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400..700&family=Unbounded:wght@500..700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved appearance before first paint; default is the light "paper" look with cobalt.
      var root = document.documentElement;
      var defaults = { theme: 'light', palette: 'cobalt', wallpaper: 'paper', glass: 'clear', solid: 'off' };
      for (var key in defaults) {
        var value = defaults[key];
        try {
          value = localStorage.getItem('tl-' + key) || value;
        } catch (e) {}
        root.dataset[key] = value;
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
